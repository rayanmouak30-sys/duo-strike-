<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<title>DUO STRIKE</title>
<link rel="icon" href="logo.svg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(60% 50% at 50% 50%, #17130b 0%, #050505 70%);
    font-family: "Arial Black", Arial, sans-serif;
  }
  a {
    font-size: clamp(64px, 18vw, 220px); letter-spacing: 0.08em; padding: 0.1em 0.3em;
    text-decoration: none; color: transparent;
    background: linear-gradient(180deg, #fff6dc 0%, #e9cd8b 40%, #b88a3e 65%, #f2d99a 100%);
    -webkit-background-clip: text; background-clip: text;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s;
  }
  a:hover, a:focus-visible { transform: scale(1.06); filter: drop-shadow(0 0 28px rgba(232, 196, 120, 0.45)); }
  a:focus-visible { outline: 2px solid #f3dda2; outline-offset: 8px; }
  @media (prefers-reduced-motion: reduce) { a { transition: none; } }
</style>
</head>
<body>
  <a href="jeu/">JEU</a>
</body>
</html>
