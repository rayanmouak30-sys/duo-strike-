<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>DUO STRIKE</title>
<meta name="description" content="DUO STRIKE : FPS tactique en 3D, directement dans le navigateur. Créé par Rayan et Clément.">
<link rel="icon" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@500;600&display=swap">
<script type="importmap">
{ "imports": { "three": "./jeu/vendor/three/build/three.module.js", "three/addons/": "./jeu/vendor/three/examples/jsm/" } }
</script>
<style>
  :root { --or: #d4ae62; --or-clair: #f3dda2; --texte: #efe9dc; --doux: #a8a092; --sortie: cubic-bezier(0.16, 1, 0.3, 1); color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #050505; color: var(--texte); font-family: "Rajdhani", Arial, sans-serif; }
  #scene3d { position: fixed; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity 1.6s var(--sortie); }
  .scene-prete #scene3d { opacity: 1; }
  .repli { position: fixed; inset: 0; opacity: 0; transition: opacity 1s; background: radial-gradient(35% 45% at 50% 38%, rgba(255, 214, 140, 0.22), transparent 70%), radial-gradient(80% 60% at 50% 110%, rgba(125, 93, 39, 0.2), transparent 70%), #050505; }
  .sans-webgl .repli { opacity: 1; }
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0, 0, 0, 0.8) 100%); }
  .grain { position: fixed; inset: -50%; pointer-events: none; opacity: 0.06; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  main { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; justify-items: center; padding: 28px 16px 26px; pointer-events: none; }
  .marque { font-family: "Orbitron", sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.6em; padding-left: 0.6em; color: var(--doux);
    opacity: 0; transform: translateY(-10px); transition: opacity 1.2s var(--sortie) 0.4s, transform 1.4s var(--sortie) 0.4s; }
  .centre { align-self: end; display: grid; justify-items: center; gap: 18px; margin-bottom: 9vh; }
  #jouer { --x: 0px; --y: 0px; pointer-events: auto; position: relative; display: inline-block; text-decoration: none;
    font-family: "Orbitron", "Arial Black", sans-serif; font-weight: 900; font-size: clamp(64px, 15vw, 190px); letter-spacing: 0.08em; padding: 0.04em 0.28em 0.08em 0.36em; line-height: 1;
    color: transparent; background: linear-gradient(180deg, #fff6dc 0%, #e9cd8b 38%, #b88a3e 62%, #f2d99a 82%, #8f6a2c 100%); -webkit-background-clip: text; background-clip: text;
    transform: translate(var(--x), var(--y)) scale(0.96); opacity: 0;
    transition: transform 0.6s var(--sortie), opacity 1.4s var(--sortie) 0.2s, filter 0.5s; }
  /* Reflet qui balaie les lettres au survol */
  #jouer::after { content: "JEU"; position: absolute; inset: 0; padding: inherit; color: transparent; pointer-events: none;
    background: linear-gradient(105deg, transparent 35%, rgba(255, 252, 235, 0.9) 50%, transparent 65%); background-size: 250% 100%; background-position: 120% 0;
    -webkit-background-clip: text; background-clip: text; transition: background-position 1s var(--sortie); }
  #jouer:hover::after, #jouer:focus-visible::after { background-position: -20% 0; }
  #jouer:hover, #jouer:focus-visible { filter: drop-shadow(0 0 30px rgba(232, 196, 120, 0.45)); }
  #jouer:focus-visible { outline: 2px solid var(--or-clair); outline-offset: 8px; border-radius: 8px; }
  .trait { width: min(340px, 60vw); height: 1px; background: linear-gradient(90deg, transparent, var(--or), transparent); transform: scaleX(0); transition: transform 1.6s var(--sortie) 0.6s; }
  .accroche { font-size: clamp(14px, 1.6vw, 18px); letter-spacing: 0.24em; text-transform: uppercase; color: var(--doux); text-align: center; opacity: 0; transition: opacity 1.4s var(--sortie) 0.9s; }
  .pied { font-size: 13px; letter-spacing: 0.12em; color: var(--doux); opacity: 0; transition: opacity 1.4s var(--sortie) 1.1s; }
  .pied strong { color: var(--texte); font-weight: 600; }
  .pret .marque { opacity: 1; transform: none; }
  .pret #jouer { opacity: 1; transform: translate(var(--x), var(--y)) scale(1); }
  .pret .trait { transform: none; }
  .pret .accroche, .pret .pied { opacity: 1; }

  /* Plongée vers le jeu */
  .rideau { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.9s cubic-bezier(0.65, 0, 0.35, 1);
    background: radial-gradient(circle at 50% 42%, rgba(255, 226, 160, 0.95), rgba(212, 174, 98, 0.6) 25%, #050505 70%); }
  .depart .rideau { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.001s !important; transition-delay: 0s !important; } }
</style>
<script type="module" src="site/accueil.js"></script>
</head>
<body>
  <canvas id="scene3d" aria-hidden="true"></canvas>
  <div class="repli" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <main>
    <p class="marque">DUO STRIKE</p>
    <div class="centre">
      <a id="jouer" href="jeu/">JEU</a>
      <div class="trait" aria-hidden="true"></div>
      <p class="accroche">FPS tactique en 3D · dans ton navigateur</p>
    </div>
    <p class="pied">Créé par <strong>Rayan</strong> et <strong>Clément</strong></p>
  </main>
  <div class="rideau" aria-hidden="true"></div>
</body>
</html>
