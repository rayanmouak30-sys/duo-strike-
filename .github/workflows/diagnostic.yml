# Diagnostic en lecture seule : liste ce qu'il y a sur le serveur AlwaysData (ne modifie rien).
name: Diagnostic du serveur (lecture seule)
on:
  push:
    branches: [claude/inspiring-heisenberg-8aohf2]
    paths: [.github/workflows/diagnostic.yml]
jobs:
  lister:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "set ftp:ssl-force true; set ftp:ssl-protect-data true; open --env-password -u jeu ftp-jeu.alwaysdata.net; cls -l --time-style=%Y-%m-%d_%H:%M /www/; echo ----JEU----; cls -l --time-style=%Y-%m-%d_%H:%M /www/jeu/ | head -80; echo ----RACINE----; cls -l /"
          echo ----PAGE-ACCUEIL----
          curl -sI https://jeu.alwaysdata.net/ | head -15
          curl -s https://jeu.alwaysdata.net/ | head -c 400; echo
          echo ----HTACCESS----
          lftp -c "set ftp:ssl-force true; set ftp:ssl-protect-data true; open --env-password -u jeu ftp-jeu.alwaysdata.net; cat /www/.htaccess" || true
