# Opération ponctuelle demandée par Rayan : compte « rayaninho » au niveau maximum (tous les skins et tenues).
# Sauvegarde des données du serveur (artefact privé, 30 jours) avant toute modification.
name: Compte rayaninho au maximum
on:
  push:
    branches: [claude/inspiring-heisenberg-8aohf2]
    paths: [.github/workflows/compte-max.yml]
jobs:
  maximum:
    runs-on: ubuntu-latest
    env:
      LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      CONNEXION: "set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 3; open --env-password -u jeu ftp-jeu.alwaysdata.net"
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Télécharger les données des comptes
        run: |
          mkdir donnees
          lftp -c "$CONNEXION; mirror --no-perms /www/donnees/ donnees/"
          ls -la donnees
      - uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-donnees-avant-compte-max
          path: donnees/
          include-hidden-files: true
          retention-days: 30
      - name: Mettre le compte au niveau maximum
        run: |
          python3 - <<'PY'
          import json, os, sys, time
          users = json.load(open("donnees/utilisateurs.json"))
          cible = [u for u in users if str(u.get("pseudo", "")).lower() == "rayaninho"]
          if not cible:
              print(f"::error::Aucun compte « rayaninho » sur le serveur ({len(users)} comptes au total).")
              sys.exit(1)
          u = cible[0]
          chemin = "donnees/duostrike_profils.json"
          profils = json.load(open(chemin)) if os.path.exists(chemin) else {}
          s = profils.get(u["id"]) or {}
          p = s.get("profil") or {}
          avant = p.get("niveau", 1)
          p["niveau"] = 100
          p["xp"] = 0
          p["compte"] = u["pseudo"]
          p["pseudo"] = u["pseudo"]
          s["profil"] = p
          s["maj"] = int(time.time())
          profils[u["id"]] = s
          json.dump(profils, open(chemin, "w"), ensure_ascii=False, indent=4)
          print(f"Compte {u['pseudo']} : niveau {avant} -> 100 (tous les skins et tenues débloqués)")
          PY
      - name: Renvoyer le fichier modifié
        run: |
          lftp -c "$CONNEXION; put donnees/duostrike_profils.json -o /www/donnees/duostrike_profils.json"
          lftp -c "$CONNEXION; cls -l /www/donnees/"
