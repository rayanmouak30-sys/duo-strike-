# Efface tout le contenu du site AlwaysData (/www), après en avoir fait une sauvegarde
# privée (artefact GitHub gardé 30 jours). Demandé par Rayan le 18/10/2026.
name: Effacer le site en ligne (avec sauvegarde)
on:
  push:
    branches: [claude/inspiring-heisenberg-8aohf2]
    paths: [.github/workflows/nettoyage.yml]
jobs:
  effacer:
    runs-on: ubuntu-latest
    env:
      LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      CONNEXION: "set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 3; open --env-password -u jeu ftp-jeu.alwaysdata.net"
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Sauvegarder tout le contenu de /www
        run: |
          mkdir sauvegarde
          lftp -c "$CONNEXION; mirror --no-perms --parallel=4 /www/ sauvegarde/"
          find sauvegarde -type f | wc -l
          du -sh sauvegarde
          test "$(find sauvegarde -type f | wc -l)" -gt 0
      - uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-site-jeu-alwaysdata
          path: sauvegarde/
          include-hidden-files: true
          retention-days: 30
      - name: Effacer tout le contenu de /www
        run: |
          lftp -c "$CONNEXION; cd /www; glob -a rm -r -f *; glob -a rm -r -f .[!.]*" || true
          echo "Contenu restant :"
          lftp -c "$CONNEXION; cls -a -l /www/"
          echo "Réponse du site :"
          curl -s -o /dev/null -w "%{http_code}\n" https://jeu.alwaysdata.net/
